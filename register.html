<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Qurban Berberkah</title>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="screen">
    <div class="screen__content">
      <form class="register" action="register.php" method="post" enctype="multipart/form-data">
        <div class="register__field">
          <i class="register__icon fas fa-user"></i>
          <input type="text" class="register__input" placeholder="User name" name="username" required>
        </div>
        <div class="register__field">
          <i class="register__icon fas fa-lock"></i>
          <input type="password" class="register__input" placeholder="Password" name="password" required>
        </div>
        <div class="register__field">
          <i class="register__icon fas fa-user-plus"></i>
          <input type="text" class="register__input" placeholder="Aktif" name="aktif" required>
        </div>
        <div class="register__field">
          <i class="register__icon fas fa-user-cog"></i>
          <input type="text" class="register__input" placeholder="Role" name="role" required>
        </div>
        <div class="register__field">
          <i class="register__icon fas fa-camera"></i>
          <input type="file" class="register__input" name="foto" required>
        </div>
        <button class="button register__submit" name="submit">
          <span class="button__text">Register</span>
          <i class="button__icon fas fa-chevron-right"></i>
        </button>
      </form>
      <div class="social-login">
        <h3>Register</h3>
        <div class="social-icons">
          <a href="#" class="social-login__icon fab fa-instagram"></a>
          <a href="#" class="social-login__icon fab fa-facebook"></a>
          <a href="#" class="social-login__icon fab fa-twitter"></a>
        </div>
      </div>
    </div>
    <div class="screen__background">
      <span class="screen__background__shape screen__background__shape4"></span>
      <span class="screen__background__shape screen__background__shape3"></span>
      <span class="screen__background__shape screen__background__shape2"></span>
      <span class="screen__background__shape screen__background__shape1"></span>
    </div>
  </div>
</div>
</body>
</html>
